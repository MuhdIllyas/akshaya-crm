<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-light.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshaya Sahayi</title>
    <script>
      // Applies the saved theme before first paint. Keep the path rule in sync with ThemeContext.jsx.
      (function () {
        try {
          var saved = localStorage.getItem('akshaya-theme');
          var wantsDark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (wantsDark && /^\/(dashboard|login|customer\/(?!register))/.test(location.pathname)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
